[project]
name = "robot-mtiny-control"
version = "0.1.0"
description = "Unofficial host control for the Makeblock mTiny toy robot over Bluetooth"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "build", "library", "device-backups", "device-actions"]

[tool.ruff.lint]
# Light rule set: syntax errors, undefined names, unused imports/variables, basic statement checks.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E701",  # the protocol modules use compact one-line if/for bodies
    "E702",  # ... and semicolon-separated statements
    "E731",  # ... and short lambdas bound to names
]
